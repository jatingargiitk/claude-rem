<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>coding-brain</title>
<style>
  :root {
    --bg: #f3efe6;
    --bg-2: #ebe4d6;
    --ink: #1c1914;
    --muted: #6b6358;
    --line: #d4cbb8;
    --card: #faf7f0;
    --accent: #245c8a;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; }
  body { min-height: 100vh; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 90px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px;
    margin-bottom: 16px;
  }
  header.top h1 {
    font-family: var(--serif); font-weight: 700; font-size: 1.85rem;
    margin: 0; letter-spacing: -0.02em;
  }
  header.top .fresh { margin-left: auto; color: var(--muted); font-size: 0.82rem;
    font-family: var(--mono); }

  .receipt {
    font-family: var(--mono); font-size: 0.88rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    margin-bottom: 26px; overflow-x: auto; white-space: nowrap;
  }

  .search { display: flex; gap: 8px; margin-bottom: 10px; }
  .search input {
    flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); font: inherit;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search button {
    appearance: none; border: 1px solid var(--line); background: var(--card);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 500;
  }
  .search button:hover { border-color: var(--ink); }

  .results { position: relative; margin-bottom: 26px; display: none; }
  .results pre {
    margin: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 40px 14px 16px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
    font-family: var(--mono); font-size: 0.8rem; line-height: 1.55; max-height: 320px;
  }
  .results .clear {
    position: absolute; top: 8px; right: 8px; appearance: none; border: 0;
    background: var(--bg-2); color: var(--muted); width: 24px; height: 24px;
    border-radius: 999px; cursor: pointer; font-size: 0.95rem; line-height: 1;
  }
  .results .clear:hover { color: var(--ink); }

  .brief { margin-bottom: 26px; }
  .brief > button.head {
    all: unset; display: flex; width: 100%; align-items: baseline; gap: 10px;
    cursor: pointer; padding: 12px 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .brief > button.head:hover { border-color: var(--ink); }
  .brief .caret { font-family: var(--mono); color: var(--muted); font-size: 0.8rem; }
  .brief .t { font-family: var(--serif); font-weight: 700; font-size: 1.02rem; }
  .brief .age { margin-left: auto; color: var(--muted); font-size: 0.8rem; font-family: var(--mono); }
  .brief .body { display: none; margin-top: 8px; }
  .brief.open .body { display: block; }
  .brief .body pre {
    margin: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 16px 18px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; font-family: var(--mono); font-size: 0.82rem; line-height: 1.6;
  }

  h2.stream-h {
    font-family: var(--serif); font-size: 1.1rem; font-weight: 700; margin: 0 0 4px;
  }
  .stream-sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; }

  ul.feed { list-style: none; padding: 0; margin: 0; }
  ul.feed > li { padding: 14px 2px; border-bottom: 1px solid var(--line); }
  ul.feed > li:last-child { border-bottom: 0; }
  .entry-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; cursor: pointer; }
  .entry-head .subject { font-weight: 600; }
  .entry-head .when { margin-left: auto; color: var(--muted); font-size: 0.78rem;
    font-family: var(--mono); white-space: nowrap; }
  .chips { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.75rem;
    font-weight: 600; background: var(--bg-2); color: var(--muted);
    font-family: var(--mono);
  }
  button.chip.digest {
    appearance: none; border: 0; cursor: pointer; color: var(--accent);
    background: var(--bg-2); font: inherit; font-size: 0.75rem; font-weight: 600;
    font-family: var(--mono); padding: 2px 9px; border-radius: 999px;
  }
  button.chip.digest:hover { background: var(--accent); color: var(--card); }
  .inline-digest { display: none; margin-top: 10px; }
  li.open .inline-digest { display: block; }
  .inline-digest pre {
    margin: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 16px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; font-family: var(--mono); font-size: 0.8rem; line-height: 1.55;
    max-height: 60vh;
  }

  .empty { color: var(--muted); padding: 20px 0; font-style: italic; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>coding-brain</h1>
      <div class="sub" style="color:var(--muted);font-size:0.92rem">What your agent remembers — and whether it's helping</div>
      <div class="fresh" id="clock">—</div>
    </header>

    <div class="receipt" id="receipt">—</div>

    <h2 class="stream-h" style="margin-bottom:8px">Ask your brain</h2>
    <div class="search">
      <input id="q" placeholder="e.g. how did we fix the login bug · which port · why did we choose X" autocomplete="off" />
      <button id="q-go">Search</button>
    </div>
    <div class="results" id="results">
      <button class="clear" id="q-clear" title="Dismiss">×</button>
      <pre id="q-out"></pre>
    </div>

    <div class="brief" id="brief">
      <button class="head" id="brief-head">
        <span class="caret" id="brief-caret">▸</span>
        <span class="t">What it knows right now</span>
        <span class="age" id="brief-age"></span>
      </button>
      <div class="body">
        <div style="font-family:var(--mono);font-size:0.72rem;color:var(--muted);margin:6px 0 4px">STATE.md</div>
        <pre id="brief-body">loading…</pre>
      </div>
    </div>

    <h2 class="stream-h">What it's learned</h2>
    <div class="stream-sub">newest first · click any row for the full note</div>
    <div id="feed"><div class="empty">Loading…</div></div>
  </div>

<script>
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

// ---------------------------------------------------------------- receipt

async function loadReceipt() {
  const d = await (await fetch("/api/overview")).json();
  $("#clock").textContent = "updated " + d.now;
  $("#receipt").textContent = d.receipt || "—";
}

// ----------------------------------------------------------------- search

const go = async () => {
  const q = $("#q").value.trim();
  if (!q) return;
  $("#results").style.display = "block";
  $("#q-out").textContent = "searching…";
  const d = await (await fetch("/api/search?q=" + encodeURIComponent(q))).json();
  $("#q-out").textContent = d.text || "(no output)";
};
$("#q-go").addEventListener("click", go);
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
$("#q-clear").addEventListener("click", () => {
  $("#results").style.display = "none";
  $("#q-out").textContent = "";
});

// --------------------------------------------------- briefing (collapsed)

let briefLoaded = false;
$("#brief-head").addEventListener("click", async () => {
  const brief = $("#brief");
  const opening = !brief.classList.contains("open");
  brief.classList.toggle("open", opening);
  $("#brief-caret").textContent = opening ? "▾" : "▸";
  if (opening && !briefLoaded) {
    const d = await (await fetch("/api/state")).json();
    $("#brief-body").textContent = d.text || "(empty — it fills in after your next session)";
    $("#brief-age").textContent = d.age || "";
    briefLoaded = true;
  }
});

// ------------------------------------------------- stream with accordion

const openDigests = new Map(); // name -> digest text (kept across refreshes)

async function fetchDigest(name) {
  if (openDigests.get(name)) return openDigests.get(name);
  const d = await (await fetch("/api/digest/" + encodeURIComponent(name))).json();
  const text = d.error ? "(" + d.error + ")" : d.text;
  openDigests.set(name, text);
  return text;
}

function entryDigest(e) {
  const f = (e.files || []).find(f => f.startsWith("sessions/"));
  return f ? f.slice(9) : null;
}

// Plain-language labels — no internal vocabulary on the page.
function subjectLabel(s) {
  if (s.startsWith("harvest: ")) return s.slice(9);
  if (s.startsWith("init: lite STATE")) return "starter briefing" + s.slice("init: lite STATE".length);
  if (s.startsWith("baseline:")) return "set up";
  return s;
}

function chipLabel(f) {
  if (f.startsWith("sessions/")) {
    let n = f.slice(9).replace(/\.md$/, "").replace(/^\d{4}-\d{2}-\d{2}-/, "");
    return "note: " + n;
  }
  if (f.startsWith("topics/")) return "topic: " + f.slice(7).replace(/\.md$/, "");
  if (f === "STATE.md") return "briefing updated";
  if (f === "RULES.md") return "rules updated";
  if (f === "NOTES.md") return "notes";
  return f;
}

async function toggleDigest(li, name) {
  const already = li.classList.contains("open") && li.dataset.open === name;
  // Collapse whatever this row is showing.
  li.classList.remove("open");
  delete li.dataset.open;
  if (already) { openDigests.delete(name); return; }
  const text = await fetchDigest(name);
  li.querySelector(".inline-digest pre").textContent = text;
  li.dataset.open = name;
  li.classList.add("open");
}

async function loadStream() {
  const d = await (await fetch("/api/feed")).json();
  const feed = $("#feed");
  if (!d.entries || !d.entries.length) {
    feed.innerHTML = `<div class="empty">${esc(d.error || "Nothing learned yet — this fills in as you work.")}</div>`;
    return;
  }
  feed.innerHTML = `<ul class="feed">` + d.entries.map((e, i) => `
    <li data-i="${i}">
      <div class="entry-head">
        <span class="subject">${esc(subjectLabel(e.subject))}</span>
        <span class="when">${esc(e.age)}</span>
      </div>
      <div class="chips">${(e.files || []).map(f => f.startsWith("sessions/")
        ? `<button class="chip digest" data-name="${esc(f.slice(9))}">${esc(chipLabel(f))}</button>`
        : `<span class="chip">${esc(chipLabel(f))}</span>`).join("")}</div>
      <div class="inline-digest"><pre></pre></div>
    </li>`).join("") + `</ul>`;

  const entries = d.entries;
  feed.querySelectorAll("ul.feed > li").forEach((li) => {
    const e = entries[Number(li.dataset.i)];
    li.querySelector(".entry-head").addEventListener("click", () => {
      const name = entryDigest(e);
      if (name) toggleDigest(li, name);
    });
    li.querySelectorAll("button.chip.digest").forEach((btn) => {
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        toggleDigest(li, btn.dataset.name);
      });
    });
    // Re-open what the reader had open before this refresh.
    const name = entryDigest(e);
    if (name && openDigests.has(name)) {
      li.querySelector(".inline-digest pre").textContent = openDigests.get(name);
      li.dataset.open = name;
      li.classList.add("open");
    }
  });
}

loadReceipt();
loadStream();
setInterval(() => { loadReceipt(); loadStream(); }, 15000);
</script>
</body>
</html>
